# Consumer-facing ivpm manifest, staged into the release tarball as ivpm.yaml
# by edapack-common's ec_stage_release_ivpm.
#
# This is NOT the project's ivpm.yaml. That one describes how to *build*
# xlsynth-bin (edapack-common, test deps); shipping it would make anyone
# installing a release fetch all of that just to run the tools.
#
# DSLX_STDLIB_PATH and XLS_DSO_PATH are deliberately NOT here. ivpm emits a
# package's `env:` directives only when that package is the ROOT project; for
# an installed dependency they are silently ignored, so a consumer would never
# see them (found by installing v0.59.0 through ivpm). They are exported from
# scripts/export.envrc, which ivpm does source for every dependency. The PATH
# entry below is the same no-op for consumers -- export.envrc's PATH_add is
# what works -- and stays for parity with the other edapack *-bin manifests.
package:
  name: xlsynth-bin

  env:
  - name: PATH
    path-prepend: "${IVPM_PACKAGES}/xlsynth-bin/bin"
